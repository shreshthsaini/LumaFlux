# Fallback configuration: FLUX.1-schnell (Apache-2.0, ungated). Identical to
# flux_dev.yaml except the backbone; schnell has no guidance embedding.
model:
  backbone: black-forest-labs/FLUX.1-schnell
  siglip: google/siglip-so400m-patch14-384
  dtype: bf16
  gradient_checkpointing: true
  rank: 8
  bottleneck: 64
  num_knots: 8
  phys_channels: 32
  stats_dim: 16
  num_bands: 8
  num_null_tokens: 8
  modulation_hidden: 128
  guidance_scale: 1.0
  peak_nits: 1000.0

train:
  max_steps: 200000
  batch_size: 4           # per process
  grad_accum: 1
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.01
  warmup_steps: 5000
  crop_size: 512
  bridge_noise: 0.05
  recon_every: 4
  w_velocity: 1.0
  lambda1: 1.0
  lambda2: 0.5
  lambda3: 0.1
  max_grad_norm: 1.0
  mixed_precision: bf16
  num_workers: 8
  log_every: 50
  ckpt_every: 5000
  trackio_project: lumaflux
  seed: 0
